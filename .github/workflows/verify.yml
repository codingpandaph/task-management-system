name: Verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.8.0
          cache: yarn
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn security:secrets
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test:unit
      - run: yarn test:tooling
      - run: yarn build
